services:
  db:
    # pgvector/pgvector ships PostgreSQL with the `vector` extension preinstalled.
    image: pgvector/pgvector:pg16
    container_name: rag_demo_pg
    environment:
      POSTGRES_DB: rag_demo
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ragpassword
    ports:
      # Host 5433 avoids clashing with a native postgres on 5432; container stays 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
